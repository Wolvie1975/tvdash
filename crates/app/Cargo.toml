[package]
name = "tvdash"
description = "TV dashboard: laptop control window + TV playback window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tvdash"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
directories.workspace = true
image.workspace = true
slint = { workspace = true, features = ["unstable-winit-030"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tvdash-core.workspace = true
tvdash-media.workspace = true
tvdash-player.workspace = true
tvdash-widgets.workspace = true
tvdash-discover.workspace = true
tvdash-events.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
glow = "0.18"
qrcode = { version = "0.14", default-features = false }
zbus.workspace = true
futures-util.workspace = true
rand.workspace = true
rand_chacha.workspace = true
tiny-skia.workspace = true

[build-dependencies]
slint-build.workspace = true


[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/tvdash", dest = "/usr/bin/tvdash", mode = "755" },
    { source = "../../packaging/tvdash.desktop", dest = "/usr/share/applications/tvdash.desktop", mode = "644" },
    { source = "../../packaging/tvdash.svg", dest = "/usr/share/icons/hicolor/scalable/apps/tvdash.svg", mode = "644" },
    { source = "../../extras/back-pill/manifest.json", dest = "/usr/share/tvdash/back-pill/manifest.json", mode = "644" },
    { source = "../../extras/back-pill/pill.js", dest = "/usr/share/tvdash/back-pill/pill.js", mode = "644" },
    { source = "../../extras/back-pill/worker.js", dest = "/usr/share/tvdash/back-pill/worker.js", mode = "644" },
]
post_install_script = """
update-desktop-database /usr/share/applications >/dev/null 2>&1 || true
gtk-update-icon-cache -q -f /usr/share/icons/hicolor >/dev/null 2>&1 || true
"""
post_uninstall_script = """
update-desktop-database /usr/share/applications >/dev/null 2>&1 || true
gtk-update-icon-cache -q -f /usr/share/icons/hicolor >/dev/null 2>&1 || true
"""

[package.metadata.generate-rpm.requires]
mpv = "*"
mpv-libs = "*"
