[package]
name = "tvdash"
description = "TV dashboard: laptop control window + TV playback window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tvdash"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
directories.workspace = true
image.workspace = true
slint = { workspace = true, features = ["unstable-winit-030"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tvdash-core.workspace = true
tvdash-media.workspace = true
tvdash-player.workspace = true
tvdash-widgets.workspace = true
tvdash-discover.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
glow = "0.18"
zbus.workspace = true
futures-util.workspace = true

[build-dependencies]
slint-build.workspace = true


[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/tvdash", dest = "/usr/bin/tvdash", mode = "755" },
    { source = "../../packaging/tvdash.desktop", dest = "/usr/share/applications/tvdash.desktop", mode = "644" },
    { source = "../../packaging/tvdash.svg", dest = "/usr/share/icons/hicolor/scalable/apps/tvdash.svg", mode = "644" },
]

[package.metadata.generate-rpm.requires]
mpv = "*"
mpv-libs = "*"
