[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.16"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal crates
tvdash-core = { path = "crates/core" }
tvdash-media = { path = "crates/media" }
tvdash-player = { path = "crates/player" }
tvdash-widgets = { path = "crates/widgets" }
tvdash-discover = { path = "crates/discover" }

# External
tokio = { version = "1.54", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.29", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
directories = "6"
async-trait = "0.1"
slint = "1.18"
slint-build = "1.18"
zbus = "5"
futures-util = "0.3"
